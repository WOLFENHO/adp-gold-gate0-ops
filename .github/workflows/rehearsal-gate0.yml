name: ADP Rehearsal Gate 0 backup and restore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adp-rehearsal-gate0
  cancel-in-progress: false

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Export and verify isolated restore
        run: python3 scripts/gate0_backup_restore.py
      - name: Retain verified private backup for seven days
        uses: actions/upload-artifact@v4
        with:
          name: adp-rehearsal-gate0-verified
          path: ${{ runner.temp }}/adp-rehearsal-gate0/verified-backup.tar.gz
          retention-days: 7
          if-no-files-found: error
